name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치는 보통 develop으로 PR을 생성하기 때문에 develop이 target 브랜치에 포함되어 있다면 별도로 적지 않아도 됩니다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    services:
      # 프로젝트가 PostgreSQL + pgvector(RAG embedding) 사용.
      # 일반 postgres:16 에는 pgvector 가 없어 `type "vector" does not exist` 발생 →
      # ankane/pgvector 또는 pgvector/pgvector 의 사전 빌드 이미지 사용.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ai_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: pw1234
      DB_NAME: ai_health
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Install postgres client (pg_isready, psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres failed to start"; exit 1

      - name: Create test database + pgcrypto/vector extensions
        env:
          PGPASSWORD: pw1234
        run: |
          # conftest.py 는 'test' DB 에 접속한다. 미리 생성하고 필수 확장 활성화.
          # - pgcrypto: UUID PK 마이그레이션의 gen_random_uuid()
          # - vector  : app/models/rag.py 의 VectorField(dimensions=768)
          psql -h localhost -U postgres -d ai_health -c "CREATE DATABASE test;" || true
          for db in ai_health test; do
            psql -h localhost -U postgres -d "$db" -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
            psql -h localhost -U postgres -d "$db" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          done

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          uv run coverage run -m pytest app
          uv run coverage report -m
