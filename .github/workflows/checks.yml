name: ci.yml

on:
  push:
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'
  pull_request:
    # feature 브랜치는 보통 develop으로 PR을 생성하기 때문에 develop이 target 브랜치에 포함되어 있다면 별도로 적지 않아도 됩니다.
    branches:
      - main
      - develop
      - 'release/*'
      - 'hotfix/*'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff Check (Linting)
        run: uv run ruff check .

      - name: Run Ruff Format Check
        run: uv run ruff format . --check

  test:
    runs-on: ubuntu-latest
    services:
      # 프로젝트가 PostgreSQL + pgvector(RAG embedding) 사용.
      # 일반 postgres:16 에는 pgvector 가 없어 `type "vector" does not exist` 발생 →
      # ankane/pgvector 또는 pgvector/pgvector 의 사전 빌드 이미지 사용.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pw1234
          POSTGRES_DB: ai_health
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: postgres
      DB_PASSWORD: pw1234
      DB_NAME: ai_health
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --group app --frozen

      - name: Install postgres client (pg_isready, psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres failed to start"; exit 1

      - name: Setup template1 + create test database (extensions inherited)
        env:
          PGPASSWORD: pw1234
        run: |
          # tortoise.contrib.test._init_db 가 매 세션마다 'test' DB 를 DROP/CREATE 재생성한다.
          # (tortoise/contrib/test/__init__.py:77-87  _drop_databases → init(_create_db=True))
          # 그래서 'test' DB 에 직접 CREATE EXTENSION 해두어도 다음 init 시 사라진다.
          # 해결: PostgreSQL 의 CREATE DATABASE 는 default 로 template1 을 복제하므로
          #       template1 에 확장을 미리 활성화하면 이후 만들어지는 모든 DB 가 자동 상속.
          # - pgcrypto: UUID PK 마이그레이션의 gen_random_uuid()
          # - vector  : app/models/rag.py 의 VectorField(dimensions=768)
          for ext in pgcrypto vector; do
            psql -h localhost -U postgres -d template1 -c "CREATE EXTENSION IF NOT EXISTS ${ext};"
          done
          # ai_health 자체에도 동일 확장 보장 (이미 만들어진 DB 라 template1 상속 시점 지났을 수 있음)
          for ext in pgcrypto vector; do
            psql -h localhost -U postgres -d ai_health -c "CREATE EXTENSION IF NOT EXISTS ${ext};"
          done
          # 'test' DB 는 tortoise 가 매번 DROP/CREATE 하므로 사전 생성 불필요.
          # 다만 첫 접속 전에 존재해야 init 이 멱등하게 동작하니 한 번 만들어 둔다 (실패 무시).
          psql -h localhost -U postgres -d ai_health -c "CREATE DATABASE test;" || true

      - name: Check if tests exist
        id: check_tests
        # tests 폴더나 test_*.py 파일이 있는지 확인
        run: |
          if [ -d "tests" ] || [ $(find . -name "test_*.py" | wc -l) -gt 0 ]; then
            echo "has_tests=true" >> $GITHUB_OUTPUT
          else
            echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Tests with Coverage
        if: steps.check_tests.outputs.has_tests == 'true'
        run: |
          uv run coverage run -m pytest app
          uv run coverage report -m
