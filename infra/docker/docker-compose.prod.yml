services:
  # 1. Redis (메시지 브로커 및 캐싱)
  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - ws
    ports:
      - "127.0.0.1:${REDIS_PORT}:6379"  # 외부 NIC 미바인딩 — 호스트 loopback 한정(디버깅용)
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 2. API Server (FastAPI) — DB 는 외부 RDS 사용(.env 의 DB_HOST 가 RDS 엔드포인트)
  fastapi:
    container_name: fastapi
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:app-${APP_VERSION}  # APP_VERSION은 빌드된 이미지의 버전관리를 위함입니다. v1.0.0 형식으로 사용합니다.
    env_file: .env
    volumes:
      - static_volume:/app/templates
      - media_volume:/app/media
    restart: always
    # 호스트 포트 미노출 — nginx 가 내부 ws 네트워크로 proxy_pass http://fastapi 한다.
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 3. AI Worker (SigLIP2 사진인증) — 동시 요청 대비 3 replica.
  # 3개 워커가 같은 큐(queue:image-verification)를 BRPOP → Redis 가 자동 분배.
  # replicas 사용을 위해 container_name 제거(고정 이름은 복제와 충돌). 실측 1벌 ~1GB.
  ai-worker:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:ai-${AI_WORKER_VERSION}  # AI_WORKER_VERSION은 빌드된 이미지의 버전관리를 위함입니다. V1.0.0 형식으로 사용합니다.
    env_file: .env
    restart: always
    mem_limit: 2G  # 워커당 상한 (SigLIP2 idle ~1GB + 추론 여유). 3×2G=6G, t3.large(8G) 내.
    deploy:
      replicas: 3
    volumes:
      # fastapi 가 업로드한 인증 사진(media_volume)을 같은 경로로 공유. 누락 시 워커가
      # stored_path 를 못 찾아 file_not_found → 전 PHOTO 인증 FAILED→REJECTED→달성률 0%.
      - media_volume:/app/media
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 3-2. Risk Inference Worker (위험도 예측 ML 추론 — CatBoost/LightGBM, queue:ml-inference)
  # SigLIP 워커(ai-worker)와 분리된 전용 프로세스 — ML 추론을 API 프로세스에서 떼어내
  # 장애/지연 격리. RISK_INFERENCE_ASYNC=true 일 때 fastapi 그래프가 이 워커로 큐 dispatch 한다.
  # ⚠️ 모델 아티팩트(models/, git 미추적)는 EC2 호스트 ~/project/models 에 번들로 두고 마운트해야 한다.
  #    번들이 없으면 추론 실패 → RISK_REQUIRE_ML=true 라 SUCCESS 미기록 → 그래프가 룰 폴백한다.
  # 2개 워커가 같은 큐(queue:ml-inference)를 BRPOP → Redis 가 자동 분배. replicas 사용을 위해
  # container_name 제거(고정 이름은 복제와 충돌). 2×2G=4G.
  risk-worker:
    image: ${DOCKER_USER}/${DOCKER_REPOSITORY}:risk-${RISK_WORKER_VERSION}
    env_file: .env  # DB_HOST(RDS)·REDIS_HOST=redis·RISK_* 플래그를 그대로 사용(override 없음).
    restart: always
    mem_limit: 2G  # 워커당 상한. CatBoost/LightGBM 추론. 2×2G=4G.
    deploy:
      replicas: 2
    volumes:
      - ./models:/app/models  # ML 모델 아티팩트(preprocess.py + 가중치). 추론에 필수, 호스트 번들 마운트.
    networks:
      - ws
    depends_on:
      redis:
        condition: service_healthy

  # 4. Nginx (웹 서버 - 요청 리버스 프록시로 전달)
  nginx:
    container_name: nginx
    image: nginx:latest
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/vol/web/static
      - media_volume:/vol/web/media
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    ports:
      - "80:80"
      - "443:443"
    networks:
      - ws
    depends_on:
      - fastapi

  # 5. certbot: SSL 인증서 발급담당
  certbot:
    image: certbot/certbot
    container_name: auto-certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 48h & wait $${!}; done;'"
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - nginx

volumes:
  static_volume:
    name: static_volume
  media_volume:
    name: media_volume
  certbot-conf:
    name: certbot-conf
  certbot-www:
    name: certbot-www

networks:
  ws:
    name: ws
    driver: bridge
