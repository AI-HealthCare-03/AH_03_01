upstream fastapi {
    server fastapi:8000;
}

# http
server {
    listen 80;
    server_name api.carelog.ai.kr;

    # 추후 certbot ssl 인증서 갱신 시 필요
    location /.well-known/acme-challenge/ {
       root /var/www/certbot;
    }

    location /api/ {
        return 301 https://$host$request_uri;
    }

    location / {
        return 404;
    }
}

# https
server {
    server_name api.carelog.ai.kr;

    listen 443 ssl;

    ssl_certificate /etc/letsencrypt/live/api.carelog.ai.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.carelog.ai.kr/privkey.pem;

    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
    }

    # 미디어 서빙: signed-URL 검증 라우트(app/apis/media.py)가 /media 에 마운트됨.
    # /api 만 프록시하면 /media/... 가 아래 location / 의 404 로 빠져 인증 사진 등
    # 비공개 미디어가 표시되지 않는다. fastapi 로 프록시해 서명 검증을 거치게 한다.
    location /media/ {
        proxy_pass http://fastapi;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
